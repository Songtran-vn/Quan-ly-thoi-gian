<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Atelier — Progress Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #f9f6f0;
    --cream: #f0ebe0;
    --parchment: #e8e0d0;
    --gold: #b8972e;
    --gold-light: #d4af57;
    --gold-pale: #f5edda;
    --gold-line: #c9a84c;
    --text-dark: #1a1610;
    --text-mid: #4a4238;
    --text-soft: #8a7d6e;
    --shadow: rgba(90,70,30,0.12);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--ivory);
    color: var(--text-dark);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(212,175,87,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(184,151,46,0.05) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }

  /* ── LAYOUT ── */
  .page-wrap {
    position: relative; z-index: 1;
    max-width: 960px; margin: 0 auto;
    padding: 20px 20px 60px;
    display: grid;
    grid-template-columns: 340px 1fr;
    grid-template-rows: auto 1fr auto;
    gap: 20px;
    min-height: 100vh;
  }

  /* Timer card — left column, rows 1+2 */
  .timer-card {
    grid-column: 1;
    grid-row: 1 / 3;
    background: #fff;
    border: 1px solid var(--parchment);
    border-radius: 2px;
    box-shadow: 0 2px 24px var(--shadow);
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: sticky;
    top: 20px;
    align-self: start;
  }

  /* Table card — right column, row 1 */
  .table-card {
    grid-column: 2;
    grid-row: 1 / 3;
    background: #fff;
    border: 1px solid var(--parchment);
    border-radius: 2px;
    box-shadow: 0 2px 24px var(--shadow);
    padding: 28px 28px;
  }

  /* Settings card — full width, row 3 */
  .settings-card {
    grid-column: 1 / 3;
    grid-row: 3;
    background: #fff;
    border: 1px solid var(--parchment);
    border-radius: 2px;
    box-shadow: 0 2px 24px var(--shadow);
    padding: 22px 28px;
  }

  .section-label {
    font-size: 0.58rem;
    font-weight: 500;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
  }
  .section-label::after {
    content: '';
    flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--parchment), transparent);
  }

  /* ── RECENT TASKS (above timer) ── */
  .recent-tasks {
    width: 100%;
    margin-bottom: 24px;
  }
  .recent-label {
    font-size: 0.55rem;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .recent-label::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--parchment), transparent);
  }
  .recent-item {
    padding: 8px 10px;
    border-left: 2px solid var(--parchment);
    margin-bottom: 6px;
    background: var(--ivory);
    border-radius: 0 2px 2px 0;
    transition: border-color 0.2s;
  }
  .recent-item:first-child { border-left-color: var(--gold-line); }
  .recent-task-text {
    font-size: 0.78rem;
    font-weight: 400;
    color: var(--text-dark);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .recent-task-meta {
    font-size: 0.62rem;
    color: var(--text-soft);
    margin-top: 2px;
  }
  .recent-empty {
    font-size: 0.72rem;
    color: var(--text-soft);
    font-style: italic;
    text-align: center;
    padding: 8px 0;
  }

  /* ── TIMER ── */
  .timer-display {
    text-align: center;
    width: 100%;
    margin-bottom: 20px;
  }
  .timer-clock {
    font-family: 'Outfit', sans-serif;
    font-size: clamp(4rem, 10vw, 6rem);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    color: var(--text-dark);
    line-height: 1;
    transition: color 0.4s;
    display: block;
  }
  .timer-clock.running { color: var(--gold); }
  .timer-clock.ending { color: #c0392b; }
  .timer-sublabel {
    font-size: 0.58rem;
    font-weight: 400;
    letter-spacing: 0.36em;
    color: var(--text-soft);
    text-transform: uppercase;
    margin-top: 6px;
    display: block;
  }

  .duration-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
    width: 100%;
  }
  .btn-duration {
    font-family: 'Outfit', sans-serif;
    font-size: 0.65rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 8px 20px;
    border: 1px solid var(--parchment);
    background: var(--ivory);
    color: var(--text-mid);
    cursor: pointer;
    border-radius: 1px;
    transition: all 0.2s;
  }
  .btn-duration:hover, .btn-duration.active {
    border-color: var(--gold);
    background: var(--gold-pale);
    color: var(--gold);
  }
  .controls-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    width: 100%;
  }
  .btn-ctrl {
    font-family: 'Outfit', sans-serif;
    font-size: 0.62rem;
    font-weight: 400;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    padding: 10px 20px;
    border: none;
    cursor: pointer;
    border-radius: 1px;
    transition: all 0.2s;
  }
  .btn-start {
    background: var(--gold); color: #fff;
    box-shadow: 0 4px 16px rgba(184,151,46,0.35);
  }
  .btn-start:hover { background: var(--gold-light); transform: translateY(-1px); }
  .btn-pause { background: var(--cream); color: var(--text-mid); border: 1px solid var(--parchment); }
  .btn-pause:hover { background: var(--parchment); }
  .btn-reset { background: transparent; color: var(--text-soft); border: 1px solid var(--parchment); }
  .btn-reset:hover { color: var(--text-mid); border-color: var(--text-soft); }

  /* ── TABLE ── */
  .table-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap; gap: 10px;
  }
  .btn-add {
    font-family: 'Outfit', sans-serif;
    font-size: 0.62rem;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 9px 22px;
    background: var(--gold); color: #fff;
    border: none; cursor: pointer;
    border-radius: 1px;
    transition: all 0.2s;
    box-shadow: 0 3px 12px rgba(184,151,46,0.28);
  }
  .btn-add:hover { background: var(--gold-light); transform: translateY(-1px); }
  .shortcut-hint {
    font-size: 0.6rem;
    color: var(--text-soft);
    letter-spacing: 0.05em;
  }
  .shortcut-key {
    display: inline-block;
    background: var(--cream);
    border: 1px solid var(--parchment);
    border-radius: 2px;
    padding: 1px 5px;
    font-size: 0.58rem;
    color: var(--text-mid);
  }

  .table-wrap { overflow-x: auto; border: 1px solid var(--parchment); }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  thead tr { background: var(--cream); }
  th {
    font-family: 'Outfit', sans-serif;
    font-weight: 400; font-size: 0.58rem;
    letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--text-soft);
    padding: 11px 12px;
    text-align: left;
    border-bottom: 1px solid var(--parchment);
    white-space: nowrap;
  }
  td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--parchment);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--gold-pale); }

  .cell-input {
    font-family: 'Outfit', sans-serif;
    font-size: 0.8rem; font-weight: 300;
    color: var(--text-dark);
    border: none; background: transparent;
    outline: none; width: 100%;
    padding: 2px 0;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
  }
  .cell-input:focus { border-bottom-color: var(--gold-line); }
  input[type="date"].cell-input, input[type="time"].cell-input {
    color: var(--text-mid); cursor: pointer;
  }
  .link-display a {
    color: var(--gold); text-decoration: none;
    font-weight: 300;
    border-bottom: 1px solid var(--parchment);
    transition: border-color 0.2s;
    font-size: 0.75rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: inline-block; max-width: 120px;
  }
  .link-display a:hover { border-color: var(--gold); }
  .link-edit {
    font-size: 0.68rem; margin-top: 3px;
  }
  .btn-del {
    background: none; border: none;
    color: var(--parchment); cursor: pointer;
    font-size: 1rem; line-height: 1;
    padding: 2px 4px; transition: color 0.2s;
  }
  .btn-del:hover { color: #c0392b; }

  /* ── SETTINGS ── */
  .settings-toggle-row {
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; user-select: none;
    font-size: 0.58rem; font-weight: 500;
    letter-spacing: 0.38em; text-transform: uppercase;
    color: var(--gold);
  }
  .settings-toggle-row::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--parchment), transparent);
  }
  .toggle-icon { transition: transform 0.3s; font-size: 0.7rem; }
  .settings-body { display: none; margin-top: 20px; }
  .settings-body.open { display: block; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .field label {
    font-size: 0.58rem; font-weight: 400;
    letter-spacing: 0.26em; text-transform: uppercase;
    color: var(--text-soft);
  }
  .field input {
    font-family: 'Outfit', sans-serif;
    font-size: 0.8rem; font-weight: 300;
    padding: 9px 12px;
    border: 1px solid var(--parchment);
    background: var(--ivory); color: var(--text-dark);
    outline: none; border-radius: 1px;
    transition: border-color 0.2s;
  }
  .field input:focus { border-color: var(--gold-line); }
  .settings-footer { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .btn-save-sheet {
    font-family: 'Outfit', sans-serif;
    font-size: 0.62rem; font-weight: 400;
    letter-spacing: 0.22em; text-transform: uppercase;
    padding: 10px 24px;
    background: var(--text-dark); color: var(--gold-pale);
    border: none; cursor: pointer; border-radius: 1px;
    transition: all 0.2s;
  }
  .btn-save-sheet:hover { background: var(--text-mid); }
  .save-msg {
    font-size: 0.7rem; font-weight: 300;
    letter-spacing: 0.06em;
    color: var(--text-soft);
    opacity: 0; transition: opacity 0.4s;
  }
  .save-msg.show { opacity: 1; }
  .save-msg.error { color: #c0392b; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text-dark); color: var(--gold-pale);
    font-family: 'Outfit', sans-serif;
    font-size: 0.68rem; font-weight: 300;
    letter-spacing: 0.18em; text-transform: uppercase;
    padding: 12px 28px; border-radius: 1px;
    opacity: 0; transition: all 0.4s;
    pointer-events: none; z-index: 999;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── RESPONSIVE ── */
  @media (max-width: 700px) {
    .page-wrap {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto;
      padding: 12px 12px 40px;
    }
    .timer-card { grid-column: 1; grid-row: 1; position: static; }
    .table-card { grid-column: 1; grid-row: 2; }
    .settings-card { grid-column: 1; grid-row: 3; }
  }
</style>
</head>
<body>

<div class="page-wrap">

  <!-- TIMER CARD (left) -->
  <div class="timer-card">

    <!-- Recent tasks preview -->
    <div class="recent-tasks">
      <div class="recent-label">Gần đây</div>
      <div id="recentPreview"><div class="recent-empty">Chưa có công việc</div></div>
    </div>

    <div class="section-label">Đồng hồ tập trung</div>

    <div class="timer-display">
      <span class="timer-clock" id="timerClock">10:00</span>
      <span class="timer-sublabel">phút còn lại</span>
    </div>

    <div class="duration-row">
      <button class="btn-duration active" onclick="setDuration(10, this)">10 phút</button>
      <button class="btn-duration" onclick="setDuration(20, this)">20 phút</button>
    </div>

    <div class="controls-row">
      <button class="btn-ctrl btn-start" onclick="startTimer()">Bắt đầu</button>
      <button class="btn-ctrl btn-pause" onclick="pauseTimer()">Dừng</button>
      <button class="btn-ctrl btn-reset" onclick="resetTimer()">Đặt lại</button>
    </div>
  </div>

  <!-- TABLE CARD (right) -->
  <div class="table-card">
    <div class="section-label">Nhật ký công việc</div>

    <div class="table-controls">
      <div>
        <span class="shortcut-hint">Thêm nhanh: <span class="shortcut-key">Ctrl</span> + <span class="shortcut-key">D</span></span>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <span id="rowCount" style="font-size:0.72rem;font-weight:300;color:var(--text-soft);">0 mục</span>
        <button class="btn-add" onclick="addRow()">+ Thêm công việc</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Ngày</th>
            <th>Giờ</th>
            <th style="min-width:200px">Việc cần làm</th>
            <th style="min-width:130px">Link</th>
            <th style="width:36px"></th>
          </tr>
        </thead>
        <tbody id="taskBody"></tbody>
      </table>
    </div>
  </div>

  <!-- SETTINGS CARD (bottom full width) -->
  <div class="settings-card">
    <div class="settings-toggle-row" onclick="toggleSettings()">
      <span>Đồng bộ Google Sheets</span>
      <span class="toggle-icon" id="toggleIcon">▾</span>
    </div>

    <div class="settings-body" id="settingsBody">
      <div class="field" style="margin-top:16px;">
        <label>Apps Script URL</label>
        <input type="text" id="scriptUrl"
          placeholder="https://script.google.com/macros/s/..."
          value="https://script.google.com/macros/s/AKfycbwQtgA2pzMPQ5YU_EKfC9fjmtP5XEiaGFPb9VVw4P8sG7Yr67CGJLblMr0e0lvuzFv3jg/exec">
      </div>
      <div class="settings-footer">
        <button class="btn-save-sheet" onclick="saveToSheet()">Lưu lên Google Sheets</button>
        <span class="save-msg" id="saveMsg"></span>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ─── TIMER ───────────────────────────────────────────────
let totalSeconds = 600;
let remainingSeconds = 600;
let timerInterval = null;
let isRunning = false;

function setDuration(mins, btn) {
  if (isRunning) return;
  document.querySelectorAll('.btn-duration').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  totalSeconds = mins * 60;
  remainingSeconds = totalSeconds;
  updateClockDisplay();
  document.getElementById('timerClock').className = 'timer-clock';
}

function startTimer() {
  if (isRunning) return;
  isRunning = true;
  document.getElementById('timerClock').classList.add('running');
  timerInterval = setInterval(tick, 1000);
}

function pauseTimer() {
  if (!isRunning) return;
  isRunning = false;
  clearInterval(timerInterval);
  document.getElementById('timerClock').classList.remove('running');
}

function resetTimer() {
  pauseTimer();
  remainingSeconds = totalSeconds;
  updateClockDisplay();
  document.getElementById('timerClock').className = 'timer-clock';
}

function tick() {
  if (remainingSeconds <= 0) {
    pauseTimer();
    remainingSeconds = 0;
    updateClockDisplay();
    document.getElementById('timerClock').className = 'timer-clock ending';
    playChime();
    showToast('⏰ Phiên làm việc kết thúc!');
    return;
  }
  remainingSeconds--;
  updateClockDisplay();
  if (remainingSeconds <= 10) {
    document.getElementById('timerClock').classList.add('ending');
  }
}

function updateClockDisplay() {
  const m = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
  const s = (remainingSeconds % 60).toString().padStart(2, '0');
  document.getElementById('timerClock').textContent = m + ':' + s;
}

// ─── CHIME ───────────────────────────────────────────────
function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      const t = ctx.currentTime + i * 0.28;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.22, t + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
      osc.start(t); osc.stop(t + 1.1);
    });
  } catch(e) {}
}

// ─── TASK TABLE ───────────────────────────────────────────
let rows = [];

function todayStr() { return new Date().toISOString().slice(0, 10); }
function nowStr() { return new Date().toTimeString().slice(0, 5); }

function addRow(data) {
  const id = Date.now() + Math.random();
  const row = data || { id, date: todayStr(), time: nowStr(), task: '', link: '' };
  if (!data) row.id = id;
  // New rows go to the TOP
  if (!data) {
    rows.unshift(row);
  } else {
    rows.push(row);
  }
  renderTable();
  renderRecent();
  saveToBrowser();
  if (!data) {
    setTimeout(() => {
      const inputs = document.querySelectorAll('#taskBody tr td:nth-child(3) input');
      if (inputs.length) inputs[0].focus(); // first row = newest
    }, 30);
  }
}

function deleteRow(id) {
  rows = rows.filter(r => r.id !== id);
  renderTable();
  renderRecent();
  saveToBrowser();
}

function updateRow(id, field, value) {
  const r = rows.find(r => r.id === id);
  if (r) { r[field] = value; renderRecent(); saveToBrowser(); }
}

function renderTable() {
  const tbody = document.getElementById('taskBody');
  tbody.innerHTML = '';
  rows.forEach(row => {
    const tr = document.createElement('tr');
    const linkCell = row.link
      ? '<div class="link-display"><a href="' + escHtml(row.link) + '" target="_blank" rel="noopener">' + shortUrl(row.link) + '</a>' +
        '<br><input type="text" class="cell-input link-edit" value="' + escHtml(row.link) + '"' +
        ' onchange="updateRow(' + JSON.stringify(row.id) + ', \'link\', this.value); renderTable();" onfocus="this.select()"></div>'
      : '<input type="text" class="cell-input" placeholder="https://..." value="' + escHtml(row.link) + '"' +
        ' onchange="updateRow(' + JSON.stringify(row.id) + ', \'link\', this.value); renderTable();">';

    tr.innerHTML =
      '<td><input type="date" class="cell-input" value="' + escHtml(row.date) + '" onchange="updateRow(' + JSON.stringify(row.id) + ', \'date\', this.value)"></td>' +
      '<td><input type="time" class="cell-input" value="' + escHtml(row.time) + '" onchange="updateRow(' + JSON.stringify(row.id) + ', \'time\', this.value)"></td>' +
      '<td><input type="text" class="cell-input" placeholder="Mô tả công việc..." value="' + escHtml(row.task) + '" onchange="updateRow(' + JSON.stringify(row.id) + ', \'task\', this.value)"></td>' +
      '<td>' + linkCell + '</td>' +
      '<td><button class="btn-del" onclick="deleteRow(' + JSON.stringify(row.id) + ')" title="Xóa">×</button></td>';
    tbody.appendChild(tr);
  });
  document.getElementById('rowCount').textContent = rows.length + ' mục';
}

function renderRecent() {
  const el = document.getElementById('recentPreview');
  const recent = rows.filter(r => r.task).slice(0, 2);
  if (!recent.length) {
    el.innerHTML = '<div class="recent-empty">Chưa có công việc</div>';
    return;
  }
  el.innerHTML = recent.map((r, i) =>
    '<div class="recent-item">' +
    '<div class="recent-task-text">' + escHtml(r.task || '—') + '</div>' +
    '<div class="recent-task-meta">' + r.date + ' · ' + r.time + '</div>' +
    '</div>'
  ).join('');
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function shortUrl(url) {
  try { return new URL(url).hostname.replace('www.',''); } catch { return url.slice(0,20)+'…'; }
}

// ─── LOCALSTORAGE ─────────────────────────────────────────
function saveToBrowser() {
  localStorage.setItem('wa_rows', JSON.stringify(rows));
}
function loadFromBrowser() {
  try {
    rows = JSON.parse(localStorage.getItem('wa_rows') || '[]');
    renderTable();
    renderRecent();
  } catch {}
  const saved_url = localStorage.getItem('wa_scriptUrl');
  if (saved_url) document.getElementById('scriptUrl').value = saved_url;
}
document.getElementById('scriptUrl').addEventListener('input', function() {
  localStorage.setItem('wa_scriptUrl', this.value);
});

// ─── SETTINGS TOGGLE ─────────────────────────────────────
function toggleSettings() {
  const body = document.getElementById('settingsBody');
  const icon = document.getElementById('toggleIcon');
  body.classList.toggle('open');
  icon.style.transform = body.classList.contains('open') ? 'rotate(180deg)' : '';
}

// ─── GOOGLE SHEETS via Apps Script (POST) ────────────────
async function saveToSheet() {
  const scriptUrl = document.getElementById('scriptUrl').value.trim();
  if (!scriptUrl) { showSaveMsg('Vui lòng nhập Apps Script URL.', true); return; }
  if (!rows.length) { showSaveMsg('Không có dữ liệu để lưu.', true); return; }

  showSaveMsg('Đang lưu…', false);

  const payload = { rows: rows.map(r => [r.date, r.time, r.task, r.link]) };

  try {
    const res = await fetch(scriptUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    showSaveMsg('✓ Đã lưu ' + rows.length + ' dòng lên Google Sheets!', false);
    showToast('✓ Đã lưu lên Google Sheets');
  } catch(e) {
    showSaveMsg('Lỗi: ' + e.message, true);
  }
}

function showSaveMsg(msg, isError) {
  const el = document.getElementById('saveMsg');
  el.textContent = msg;
  el.className = 'save-msg show' + (isError ? ' error' : '');
  if (!isError) setTimeout(() => el.classList.remove('show'), 5000);
}

// ─── TOAST ───────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ─── KEYBOARD SHORTCUTS ───────────────────────────────────
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
    e.preventDefault();
    addRow();
  }
});

// ─── INIT ─────────────────────────────────────────────────
updateClockDisplay();
loadFromBrowser();
if (rows.length === 0) addRow();
</script>
</body>
